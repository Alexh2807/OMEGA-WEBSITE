# Configuration Netlify — site OMEGA (Vite + React SPA)

[build]
  command = "npm run build"
  publish = "dist"

  [build.environment]
    # Le scanner de secrets cherche la VALEUR de chaque variable d'environnement dans
    # le dépôt. `SUPABASE_URL` y figure forcément : c'est l'adresse publique du projet,
    # déjà servie à chaque visiteur via `VITE_SUPABASE_URL`, et elle est écrite en clair
    # dans la migration qui déclare le point d'appel des notifications.
    # On l'exclut donc du scan — et elle seule.
    # ⚠ Ne JAMAIS ajouter ici SUPABASE_SERVICE_ROLE_KEY, MAIL_PASS ni STRIPE_SECRET_KEY :
    # ce sont de vrais secrets, et c'est exactement ce que ce garde-fou protège.
    SECRETS_SCAN_OMIT_KEYS = "SUPABASE_URL"

# Messagerie du back-office : lecture IMAP et réponse SMTP de la boîte OMEGA.
# Le regroupement par esbuild embarque imapflow/mailparser/nodemailer dans le paquet
# déployé — sans quoi la fonction ne les trouverait pas à l'exécution.
[functions]
  directory = "netlify/functions"
  node_bundler = "esbuild"

# ⚠ AVANT la règle SPA, sinon elle attrape tout.
#
# Un fichier d'assets absent doit répondre 404. Sans cette règle, le repli SPA renvoyait
# index.html avec un code 200 : le navigateur recevait du HTML là où il attendait du
# JavaScript, et échouait sur un message obscur
# (« Failed to fetch dynamically imported module »). Cela arrive à tout visiteur dont
# l'onglet est resté ouvert pendant une mise en ligne, puisque Vite renomme chaque
# morceau à chaque build. Le repli côté application est dans src/utils/lazyPage.ts.
#
# Netlify sert les fichiers existants AVANT d'appliquer les redirections : les assets
# réellement présents ne passent donc jamais par ici.
[[redirects]]
  from = "/assets/*"
  to = "/index.html"
  status = 404

# SPA : toutes les autres routes sont servies par index.html (React Router gère le reste)
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# En-têtes de sécurité, sur toutes les pages.
#
# `frame-ancestors 'none'` (doublé par X-Frame-Options pour les vieux navigateurs)
# interdit d'afficher le site dans le cadre d'un autre site. Sans cela, n'importe qui
# pouvait empiler une page invisible d'omegasud.fr sous de faux boutons et faire
# cliquer un client connecté dans son dos — sur le panier ou le back-office.
# Le site ne s'affiche dans aucun cadre (le logiciel OMEGADMX ouvre le vrai navigateur),
# donc l'interdiction ne coûte rien.
#
# `nosniff` empêche le navigateur de deviner le type d'un fichier : un fichier déposé
# par un client ne peut plus être réinterprété comme du script.
# `Referrer-Policy` évite d'envoyer l'adresse complète de la page (qui peut contenir un
# identifiant de commande) aux sites tiers.
# `Permissions-Policy` coupe les capacités que le site n'utilise pas.
#
# Volontairement PAS de `script-src` ici : il faudrait rééditer ce fichier à chaque
# service ajouté, et une omission couperait les paiements. La protection contre
# l'injection vient de React, qui échappe tout ce qu'il affiche (aucun
# `dangerouslySetInnerHTML` dans le code).
[[headers]]
  for = "/*"
  [headers.values]
    Content-Security-Policy = "frame-ancestors 'none'"
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    # `payment` est délégué à Stripe : le paiement actuel n'en a pas besoin (champs de
    # carte classiques), mais activer un jour Apple Pay / Google Pay ne demandera ainsi
    # aucune retouche de ce fichier.
    Permissions-Policy = "geolocation=(), microphone=(), camera=(), payment=(self \"https://js.stripe.com\")"
